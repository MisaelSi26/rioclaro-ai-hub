name: Build and deploy RioClaro AI Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Azure deployment secrets
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$AZURE_WEBAPP_NAME" ]; then
            echo "::error::Missing repository Actions secret AZURE_WEBAPP_NAME."
            exit 1
          fi
          if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ]; then
            echo "::error::Missing repository Actions secret AZURE_WEBAPP_PUBLISH_PROFILE. Add the App Service publish profile XML."
            exit 1
          fi
          if ! printf '%s' "$AZURE_WEBAPP_PUBLISH_PROFILE" | grep -q '<publishData'; then
            echo "::error::AZURE_WEBAPP_PUBLISH_PROFILE does not look like an App Service publish profile XML."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Assemble production package
        run: |
          mkdir release
          cp package.json package-lock.json release/
          cp -R server dist release/
          npm ci --omit=dev --prefix release
          cd release
          zip -qr ../rioclaro-app.zip .

      - name: Deploy to Azure App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: rioclaro-app.zip
          startup-command: npm start
